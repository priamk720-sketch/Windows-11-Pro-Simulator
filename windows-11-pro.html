<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Pro Simulator - PriamOS</title>
    <style>
        :root {
            --bg-wallpaper: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop');
            --taskbar-bg: rgba(243, 243, 243, 0.75);
            --taskbar-border: rgba(255, 255, 255, 0.3);
            --win-bg: rgba(255, 255, 255, 0.82);
            --text-color: #1a1a1a;
            --accent-color: #0078d4;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-hover: rgba(255, 255, 255, 0.9);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            --radius: 8px;
        }

        [data-theme="dark"] {
            --taskbar-bg: rgba(32, 32, 32, 0.75);
            --taskbar-border: rgba(255, 255, 255, 0.08);
            --win-bg: rgba(32, 32, 32, 0.85);
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-hover: rgba(255, 255, 255, 0.12);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI Variable', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
        }

        #desktop {
            width: 100vw;
            height: calc(100vh - 48px);
            background-image: var(--bg-wallpaper);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        /* Desktop Shortcuts */
        .desktop-icons {
            display: grid;
            grid-template-rows: repeat(auto-fill, 96px);
            grid-auto-flow: column;
            gap: 8px;
            padding: 12px;
            height: 100%;
            width: max-content;
        }

        .shortcut {
            width: 84px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            padding: 4px;
            border: 1px solid transparent;
            transition: background 0.15s;
        }

        .shortcut:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .shortcut svg {
            width: 40px;
            height: 40px;
            margin-bottom: 6px;
        }

        .shortcut span {
            font-size: 12px;
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
        }

        /* Taskbar */
        #taskbar {
            height: 48px;
            width: 100%;
            position: absolute;
            bottom: 0;
            background: var(--taskbar-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid var(--taskbar-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            z-index: 99999;
        }

        .taskbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
        }

        .tb-btn {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .tb-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .tb-btn.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 16px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 2px;
        }

        .tb-btn svg {
            width: 24px;
            height: 24px;
        }

        .taskbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            font-size: 12px;
        }

        .tray-clock {
            text-align: right;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .tray-clock:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Windows */
        .window {
            position: absolute;
            width: 720px;
            height: 480px;
            background: var(--win-bg);
            backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid var(--taskbar-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 320px;
            min-height: 200px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .window.visible {
            opacity: 1;
            transform: scale(1);
        }

        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 48px) !important;
            border-radius: 0;
        }

        .titlebar {
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 12px;
            background: rgba(0, 0, 0, 0.02);
            cursor: move;
        }

        .titlebar-title {
            font-size: 13px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .titlebar-controls {
            display: flex;
            height: 100%;
        }

        .win-ctrl {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .win-ctrl:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        .win-ctrl.close:hover {
            background: #e81123;
            color: white;
        }

        .win-ctrl svg {
            width: 12px;
            height: 12px;
            stroke: var(--text-color);
        }

        .win-ctrl.close:hover svg {
            stroke: white;
        }

        .window-body {
            flex: 1;
            overflow: auto;
            position: relative;
            color: var(--text-color);
        }

        /* Start Menu */
        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 540px;
            height: 560px;
            background: var(--win-bg);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--taskbar-border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 999999;
            display: none;
            flex-direction: column;
            padding: 24px;
            opacity: 0;
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        #start-menu.open {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .search-bar {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--taskbar-border);
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .start-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: auto;
        }

        .start-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .start-item:hover {
            background: var(--card-hover);
        }

        .start-item svg {
            width: 32px;
            height: 32px;
        }

        .start-item span {
            font-size: 11px;
            color: var(--text-color);
            text-align: center;
        }

        .start-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--taskbar-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 600;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* App Specific Styling */
        /* Explorer */
        .explorer-layout {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 180px;
            border-right: 1px solid var(--taskbar-border);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-item:hover {
            background: var(--card-hover);
        }

        .explorer-content {
            flex: 1;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 16px;
            align-content: start;
        }

        .folder-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            gap: 6px;
        }

        .folder-item:hover {
            background: var(--card-hover);
        }

        /* Terminal */
        .cmd-body {
            background: #0c0c0c;
            color: #cccccc;
            font-family: 'Consolas', monospace;
            padding: 12px;
            height: 100%;
            overflow-y: auto;
        }

        .cmd-line {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .cmd-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            flex: 1;
        }

        /* Notepad */
        .notepad-textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding: 12px;
            background: transparent;
            color: var(--text-color);
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: none;
        }

        /* Calculator */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 12px;
            height: 100%;
            background: transparent;
        }

        .calc-display {
            grid-column: span 4;
            height: 80px;
            font-size: 36px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px;
            font-weight: 300;
        }

        .calc-btn {
            border: none;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .calc-btn:hover {
            background: var(--card-hover);
        }

        .calc-btn.accent {
            background: var(--accent-color);
            color: white;
        }
    </style>
</head>

        </div>

    <template id="tpl-calc">
        <div style="height:100%; display:flex; flex-direction:column;">
            <div class="calc-display" id="calc-val">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="calcInput('C')">C</button>
                <button class="calc-btn" onclick="calcInput('(')">(</button>
                <button class="calc-btn" onclick="calcInput(')')">)</button>
                <button class="calc-btn accent" onclick="calcInput('/')">/</button>
                <button class="calc-btn" onclick="calcInput('7')">7</button>
                <button class="calc-btn" onclick="calcInput('8')">8</button>
                <button class="calc-btn" onclick="calcInput('9')">9</button>
                <button class="calc-btn accent" onclick="calcInput('*')">*</button>
                <button class="calc-btn" onclick="calcInput('4')">4</button>
                <button class="calc-btn" onclick="calcInput('5')">5</button>
                <button class="calc-btn" onclick="calcInput('6')">6</button>
                <button class="calc-btn accent" onclick="calcInput('-')">-</button>
                <button class="calc-btn" onclick="calcInput('1')">1</button>
                <button class="calc-btn" onclick="calcInput('2')">2</button>
                <button class="calc-btn" onclick="calcInput('3')">3</button>
                <button class="calc-btn accent" onclick="calcInput('+')">+</button>
                <button class="calc-btn" onclick="calcInput('0')">0</button>
                <button class="calc-btn" onclick="calcInput('.')">.</button>
                <button class="calc-btn accent" style="grid-column: span 2;" onclick="calcInput('=')">=</button>
            </div>
        </div>
    </template>

    <template id="tpl-edge">
        <iframe src="https://bing.com" style="width:100%; height:100%; border:none;"></iframe>
    </template>

    <script>
        let zIndexCounter = 100;

        // Clock Update
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const date = now.toLocaleDateString();
            document.getElementById('clock').innerHTML = `${time}<br>${date}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Start Menu Toggle
        function toggleStart() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('open');
        }

        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        // Window Management
        function openApp(appId) {
            const titles = {
                explorer: 'File Explorer',
                notepad: 'Notepad',
                cmd: 'Terminal',
                calc: 'Calculator',
                edge: 'Microsoft Edge'
            };

            const win = document.createElement('div');
            win.className = 'window';
            win.style.zIndex = ++zIndexCounter;
            win.style.top = `${60 + Math.random() * 40}px`;
            win.style.left = `${100 + Math.random() * 100}px`;

            win.innerHTML = `
                <div class="titlebar" onmousedown="dragWindow(event, this.parentElement)">
                    <div class="titlebar-title">${titles[appId] || 'Application'}</div>
                    <div class="titlebar-controls">
                        <div class="win-ctrl" onclick="this.parentElement.parentElement.parentElement.remove()">
                            <svg viewBox="0 0 12 12"><line x1="1" y1="11" x2="11" y2="1" stroke-width="1.2"/><line x1="1" y1="1" x2="11" y2="11" stroke-width="1.2"/></svg>
                        </div>
                    </div>
                </div>
                <div class="window-body">
                    ${document.getElementById(`tpl-${appId}`).innerHTML}
                </div>
            `;

            win.onmousedown = () => win.style.zIndex = ++zIndexCounter;
            document.getElementById('desktop').appendChild(win);
            
            setTimeout(() => win.classList.add('visible'), 10);
        }

        // Drag Functionality
        function dragWindow(e, win) {
            let posX = e.clientX - win.offsetLeft;
            let posY = e.clientY - win.offsetTop;

            function moveHandler(e) {
                win.style.left = `${e.clientX - posX}px`;
                win.style.top = `${e.clientY - posY}px`;
            }

            function stopHandler() {
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', stopHandler);
            }

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', stopHandler);
        }

        // Calculator Logic
        function calcInput(val) {
            const display = document.getElementById('calc-val');
            if (!display) return;
            
            if (val === 'C') {
                display.innerText = '0';
            } else if (val === '=') {
                try {
                    display.innerText = eval(display.innerText.replace(/[^0-9+\-*/().]/g, ''));
                } catch {
                    display.innerText = 'Error';
                }
            } else {
                if (display.innerText === '0' || display.innerText === 'Error') {
                    display.innerText = val;
                } else {
                    display.innerText += val;
                }
            }
        }

        // Command Prompt Logic
        function handleCmd(e, input) {
            if (e.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                const output = input.parentElement.parentElement.querySelector('#cmd-output');
                const line = document.createElement('div');
                line.innerHTML = `<div>C:\\Users\\Priam> ${input.value}</div>`;

                let res = '';
                if (cmd === 'help') {
                    res = 'Available commands: help, clear, ver, date, priam, echo';
                } else if (cmd === 'clear' || cmd === 'cls') {
                    output.innerHTML = '';
                    input.value = '';
                    return;
                } else if (cmd === 'ver') {
                    res = 'PriamOS [Version 10.0.22621.1]';
                } else if (cmd === 'date') {
                    res = new Date().toString();
                } else if (cmd === 'priam') {
                    res = 'Welcome Commander Priam! System Operating Normally.';
                } else if (cmd.startsWith('echo ')) {
                    res = cmd.substring(5);
                } else if (cmd !== '') {
                    res = `'${cmd}' is not recognized as an internal command.`;
                }

                if (res) line.innerHTML += `<div>${res}</div><br>`;
                output.appendChild(line);
                input.value = '';
            }
        }
    </script>
</body>
</html>
