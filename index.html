<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>priamweb – Windows 11 Pro</title>
<style>
:root{--mica:rgba(32,32,32,.78);--win:#202020;--tbar:#1c1c1c;--card:#2d2d2d;--txt:#fff;--sub:#c5c5c5;--bd:rgba(255,255,255,.1);--hov:rgba(255,255,255,.08);--acc:#0078d4}
body.light{--mica:rgba(243,243,243,.8);--win:#f3f3f3;--tbar:#eef0f3;--card:#fff;--txt:#1a1a1a;--sub:#5f5f5f;--bd:rgba(0,0,0,.1);--hov:rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:var(--txt);font:14px/1.35 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.i{display:inline-block;flex:none}.i svg{width:100%;height:100%;display:block}
#wall,.bgw{position:fixed;inset:0;background:#04122e var(--wp) center/cover no-repeat}
.mica{background:var(--mica);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999}

/* boot / lock / login */
#boot{position:fixed;inset:0;background:#000;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;transition:opacity .6s}
#boot.off{opacity:0;pointer-events:none}
#boot .i{width:90px;height:90px}
.spin{width:34px;height:34px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#lock{position:fixed;inset:0;z-index:2000;color:#fff;text-align:center;padding-top:11vh;cursor:pointer;background:#04122e var(--wp) center/cover no-repeat;transition:transform .55s cubic-bezier(.7,0,.3,1)}
#lock.up{transform:translateY(-100%)}
#lt{font-size:clamp(70px,13vw,130px);font-weight:600;letter-spacing:-2px;line-height:1}
#ld{font-size:clamp(20px,3vw,30px);margin-top:6px}
#lock small{position:absolute;bottom:6vh;left:0;right:0;opacity:.85}
#login{position:fixed;inset:0;z-index:1500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;transition:opacity .45s}
#login::before{content:"";position:absolute;inset:0;background:#04122e var(--wp) center/cover;filter:blur(40px) brightness(.8);transform:scale(1.1);z-index:-1}
#login.off{opacity:0;pointer-events:none}
.ava{width:150px;height:150px;border-radius:50%;background:#6b7a90;overflow:hidden}
#login h1{font-size:28px;font-weight:600}
#pin{width:260px;padding:9px 12px;border:1px solid rgba(255,255,255,.3);border-bottom:2px solid #fff;border-radius:5px;background:rgba(0,0,0,.45);outline:none;user-select:text}
#login .go{padding:7px 24px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15)}
#login .go:hover{background:rgba(255,255,255,.28)}
#login small{position:absolute;bottom:5vh}

/* desktop */
#desk{position:fixed;top:6px;left:6px;display:flex;flex-direction:column;flex-wrap:wrap;height:calc(100% - 60px);align-content:flex-start;gap:2px}
.dic{width:88px;padding:6px 2px 4px;text-align:center;color:#fff;font-size:12px;border:1px solid transparent;border-radius:4px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.dic .i{display:block;margin:0 auto 4px}
.dic:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.1)}
.dic:focus-visible{outline:2px solid #fff;outline-offset:-2px}

/* windows */
.win{position:fixed;background:var(--win);border:1px solid var(--bd);border-radius:8px;box-shadow:0 14px 48px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;min-width:280px;min-height:180px}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0}
.win.hide{display:none}
.tb{height:32px;display:flex;align-items:center;background:var(--tbar);flex:none}
.tb .i{margin:0 8px 0 10px}
.tb span.t{flex:1;font-size:12px;white-space:nowrap;overflow:hidden}
.tb button{width:46px;height:32px;border:0;background:none;display:grid;place-items:center}
.tb button:hover{background:var(--hov)}.tb .x:hover{background:#c42b1c;color:#fff}
.body{flex:1;overflow:auto;user-select:text;min-height:0}
.pad{padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:8px}
h2{font-size:24px;font-weight:600;margin-bottom:14px}h4{font-size:13px;margin:6px 0 8px;font-weight:600}
small,.sub{color:var(--sub);font-size:12px}
.btn{padding:5px 14px;border:1px solid var(--bd);border-radius:4px;background:var(--card);margin:0 6px 6px 0}
.btn:hover{background:var(--hov)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
a{color:inherit;text-decoration:none}
/* explorer / settings layout */
.top{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--bd);align-items:center}
.top .ad{flex:1;padding:5px 10px;border:1px solid var(--bd);border-radius:4px;background:var(--card);font-size:12px}
.ex{display:flex;height:100%}
.side{width:176px;padding:8px;border-right:1px solid var(--bd);flex:none;overflow:auto}
.side div{padding:7px 10px;border-radius:4px;position:relative;font-size:13px}
.side div:hover{background:var(--hov)}
.side div.sel{background:var(--hov)}.side div.sel::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--acc)}
.main{flex:1;padding:16px;overflow:auto;min-width:0}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{width:112px;padding:10px 6px;text-align:center;font-size:12px;border-radius:4px}.file:hover{background:var(--hov)}
.file .i{display:block;margin:0 auto 6px}
.dr{display:flex;gap:14px;align-items:center}.dr>div{flex:1}
.bar{height:12px;background:var(--hov);border-radius:2px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.sw{display:inline-block;width:30px;height:30px;border-radius:4px;margin:0 6px 6px 0;border:2px solid transparent;outline:1px solid var(--bd)}
.wpt{display:inline-block;width:120px;height:70px;border-radius:6px;margin:0 8px 8px 0;background:center/cover;border:2px solid transparent}
.wpt:hover,.sw:hover{border-color:var(--acc)}
/* notepad */
.menu{display:flex;gap:2px;padding:2px 6px;font-size:12px;background:var(--tbar)}.menu span{padding:3px 8px;border-radius:4px}.menu span:hover{background:var(--hov)}
textarea{width:100%;flex:1;border:0;resize:none;background:var(--win);color:var(--txt);padding:8px 10px;font:14px Consolas,monospace;outline:none;user-select:text}
.col{display:flex;flex-direction:column;height:100%}
.stat{padding:3px 12px;font-size:11px;color:var(--sub);background:var(--tbar)}
/* calc */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;height:100%;background:var(--win)}
.calc .scr{grid-column:1/-1;text-align:right;font-size:38px;font-weight:600;padding:20px 10px 8px;overflow:hidden}
.calc button{border:0;border-radius:4px;background:var(--card);font-size:16px}
.calc button:hover{background:var(--hov)}.calc .n{background:color-mix(in srgb,var(--card) 70%,#fff 12%)}.calc .eq{background:var(--acc);color:#fff}
/* terminal / edge */
.term{background:#0c0c0c;color:#ccc;font:14px Consolas,monospace;padding:10px;height:100%;overflow:auto;white-space:pre-wrap;user-select:text}
.term input{background:none;border:0;outline:none;width:70%;font:inherit;color:#fff;user-select:text}
.edge{display:flex;flex-direction:column;height:100%}
.pg{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:9vh;background:var(--win);overflow:auto}
.pg h2{font-size:30px}
.sb{width:min(520px,86%);padding:11px 18px;border:1px solid var(--bd);border-radius:24px;background:var(--card);outline:none;user-select:text;margin-bottom:26px}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:520px}
.tile{width:100px;padding:12px 6px;text-align:center;border-radius:8px;background:var(--card);font-size:12px}.tile:hover{background:var(--hov)}
.tile .i{display:block;margin:0 auto 6px}

/* taskbar */
#bar{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:800;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:2px}
.tbn{width:44px;height:40px;border:0;border-radius:5px;background:none;display:grid;place-items:center;position:relative}
.tbn:hover{background:var(--hov)}.tbn:active .i{transform:scale(.85)}
.tbn.on::after{content:"";position:absolute;bottom:1px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:#8a8a8a;transition:width .15s,margin .15s}
.tbn.act{background:var(--hov)}.tbn.act::after{width:16px;margin-left:-8px;background:var(--acc)}
#sbox{display:flex;align-items:center;gap:8px;width:170px;height:34px;padding:0 12px;margin-right:4px;border:1px solid var(--bd);border-radius:17px;background:var(--hov);font-size:12px;color:var(--sub)}
#sbox:hover{background:var(--card)}
#tray{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;gap:2px}
.tr{height:38px;padding:0 8px;border:0;border-radius:5px;background:none;display:flex;gap:9px;align-items:center;font-size:12px;text-align:right;line-height:1.25}
.tr:hover{background:var(--hov)}.tr svg{width:16px;height:16px}

/* flyouts */
.fly{position:fixed;bottom:56px;z-index:900;border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 44px rgba(0,0,0,.45);display:none}
.fly.open{display:block;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fly.open{animation:none}#lock{transition:none}}
#start{left:50%;width:min(640px,98vw);margin-left:calc(min(640px,98vw)/-2);height:min(620px,calc(100% - 70px));padding:28px 28px 0}
#ssearch{width:100%;padding:9px 14px;border:1px solid var(--bd);border-bottom:2px solid var(--acc);border-radius:20px;background:var(--card);outline:none;margin-bottom:22px;user-select:text}
.sh{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
.sh span{font-weight:400;font-size:12px;background:var(--card);padding:2px 10px;border-radius:4px;border:1px solid var(--bd)}
.pin{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:22px}
.pin div{padding:10px 2px 8px;text-align:center;font-size:12px;border-radius:5px}.pin div:hover{background:var(--hov)}.pin .i{display:block;margin:0 auto 6px}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rec div{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:5px;font-size:12px}.rec div:hover{background:var(--hov)}
.sf{position:absolute;left:0;right:0;bottom:0;height:64px;background:rgba(128,128,128,.12);border-top:1px solid var(--bd);border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.sf .u{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:5px}.sf .u:hover,.pw:hover{background:var(--hov)}
.sf .ava{width:30px;height:30px}.pw{width:40px;height:36px;border:0;border-radius:5px;background:none;display:grid;place-items:center}
#pmenu{position:absolute;right:30px;bottom:60px;width:160px;padding:4px;display:none}#pmenu.open{display:block}
#pmenu div{padding:8px 12px;border-radius:4px}#pmenu div:hover{background:var(--hov)}
#qs{right:12px;width:360px;padding:20px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tg div{height:58px;border-radius:5px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:4px}
.tg div.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sl{display:flex;gap:12px;align-items:center;margin:10px 0}.sl input{flex:1;accent-color:var(--acc)}
#cal{right:12px;width:340px;padding:18px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;font-size:12px}
.cg b{font-weight:400;color:var(--sub);padding:4px}.cg span{padding:8px 0;border-radius:50%}.cg .td{background:var(--acc);color:#fff}
#ctx{position:fixed;z-index:1000;width:230px;padding:4px;border:1px solid var(--bd);border-radius:8px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#ctx div{padding:7px 12px;border-radius:4px}#ctx div:hover{background:var(--hov)}#ctx hr{border:0;border-top:1px solid var(--bd);margin:4px 0}
#off{position:fixed;inset:0;background:#000;z-index:4000;display:none;place-items:center;color:#666;cursor:pointer}
@media (max-width:760px){#sbox{width:40px;padding:0;justify-content:center}#sbox span{display:none}.tr.dt{display:none}.pin{grid-template-columns:repeat(4,1fr)}.rec{grid-template-columns:1fr}.side{width:110px}}
#lock::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.4));z-index:-1}
#ls{position:absolute;right:28px;bottom:26px;display:flex;gap:16px}#ls svg{width:18px;height:18px}
#wgb{text-align:left}#wgb .i svg{width:100%;height:100%}#wgb .i{margin-right:2px}#tv svg{width:20px;height:20px}
#wg{left:12px;width:min(580px,97vw);height:min(620px,calc(100% - 70px));padding:18px;overflow:auto}
#wg h3{font-size:18px;font-weight:600;margin-bottom:12px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;min-height:140px}.wc.w2{grid-column:1/-1}
.wx{display:flex;gap:14px;align-items:center}.wx .big{font-size:42px;font-weight:300;line-height:1.1}.wx .i{width:56px;height:56px}
.fc{display:flex;justify-content:space-between;margin:14px 0 8px;font-size:12px;color:var(--sub)}.fc div{display:flex;flex-direction:column;gap:4px;align-items:center}.fc svg{width:24px;height:24px}
.todo{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}.todo.d span{text-decoration:line-through;color:var(--sub)}
#tdin{width:100%;padding:6px 8px;border:0;border-bottom:2px solid var(--acc);background:var(--hov);border-radius:4px;outline:none;margin-top:8px;user-select:text}
#tvw{position:fixed;inset:0 0 48px;z-index:750;background:rgba(0,0,0,.5);backdrop-filter:blur(18px);display:none;flex-wrap:wrap;gap:18px;align-content:center;justify-content:center;padding:40px}#tvw.open{display:flex}
.tvc{width:230px;height:160px;border-radius:8px;background:var(--win);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.4)}.tvc:hover{outline:2px solid var(--acc)}
.cv{flex:1;min-height:0;position:relative;background:#fff}.cv canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.pal{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.pal i{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.app{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:8px}.app>div{flex:1}
.cam{position:relative;height:100%;display:grid;place-items:center;background:#000}.cam video{width:100%;height:100%;object-fit:cover}.cam .btn{position:absolute;bottom:14px}
.pg.fr0{padding:0;display:block;position:relative}.fr{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.al{display:flex;gap:14px;align-items:center;padding:8px 10px;border-radius:5px}.al:hover{background:var(--hov)}
#allv{height:calc(100% - 100px);overflow:auto}#allb{cursor:pointer}
@media (max-width:760px){#wgb span:last-child{display:none}.wgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="wall"></div>
<div id="desk"></div>
<div id="wins"></div>

<div id="start" class="fly mica">
  <input id="ssearch" placeholder="Search for apps, settings, and documents" autocomplete="off">
  <div id="home"><div class="sh">Pinned<span id="allb" role="button">All apps ›</span></div>
  <div class="pin" id="pins"></div>
  <div class="sh">Recommended</div>
  <div class="rec" id="rec"></div></div><div id="allv" style="display:none"></div>
  <div class="sf"><div class="u"><div class="ava" id="sava"></div>Priam</div><button class="pw" id="pwr" aria-label="Power"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 1.5v7M4.6 4a6 6 0 108.8 0"/></svg></button>
    <div id="pmenu" class="mica fly" style="bottom:60px"><div data-p="restart">Restart</div><div data-p="off">Shut down</div></div></div>
</div>
<div id="qs" class="fly mica">
  <div class="tg" id="tg"></div>
  <div class="sl">☀<input type="range" id="br" min="30" max="100" value="100" aria-label="Brightness"></div>
  <div class="sl">🔊<input type="range" min="0" max="100" value="60" aria-label="Volume"></div>
</div>
<div id="cal" class="fly mica"><h4 id="cmo" style="font-size:15px;margin-bottom:12px"></h4><div class="cg" id="cg"></div></div>
<div id="wg" class="fly mica"></div>
<div id="tvw"></div>
<div id="ctx" class="mica"></div>

<div id="bar" class="mica">
  <button class="tr" id="wgb" aria-label="Widgets" style="position:absolute;left:6px;top:5px"></button>
  <button class="tbn" id="sb" aria-label="Start"></button>
  <div id="sbox" role="button" tabindex="0"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="6.5" r="5"/><path d="M10.5 10.5L15 15"/></svg><span>Search</span></div>
  <button class="tbn" id="tv" aria-label="Task view"></button><span id="tasks" style="display:flex;gap:2px"></span>
  <div id="tray">
    <button class="tr" id="qsb" aria-label="Quick settings"></button>
    <button class="tr dt" id="clk"><span><div id="tt"></div><div id="td"></div></span></button>
  </div>
</div>

<div id="login"><div class="ava" id="lava"></div><h1>Priam</h1><input id="pin" type="password" placeholder="PIN (anything works)" autocomplete="off"><button class="go">Sign in</button><small>Sign-in options</small></div>
<div id="lock" tabindex="0" role="button" aria-label="Unlock"><div id="lt"></div><div id="ld"></div><small>Click or press any key to continue</small><div id="ls"></div></div>
<div id="boot"><span class="i" id="blogo"></span><div class="spin"></div></div>
<div id="off"><span>Click to power on</span></div>
<div id="dim"></div>

<script>
/* ===== EDIT YOUR STUFF HERE ===== */
const ME={
  bio:"Hi, I’m Priam. I make games and websites, and this whole PC is a website I built myself.",
  projects:[
    {title:"reCAPTCHA (Scratch game)",link:"https://scratch.mit.edu/"},
    {title:"priamweb",link:"#"}
  ],
  links:[{n:"GitHub",u:"https://github.com/"},{n:"Scratch",u:"https://scratch.mit.edu/"}]
};
/* ================================ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const save=(k,v)=>{try{localStorage.setItem("priamweb-"+k,v)}catch(e){}},load=k=>{try{return localStorage.getItem("priamweb-"+k)}catch(e){return null}};
const S=b=>`<svg viewBox="0 0 48 48">${b}</svg>`;
const I={
win:S('<path fill="#2aa4ff" d="M5 7.5l17-2.3v17.3H5zM25 4.8L43 2.3v20.2H25zM5 25.5h17v17.3L5 40.5zM25 25.5h18v20.2L25 43.2z"/>'),
folder:S('<path fill="#e8a317" d="M4 12a4 4 0 014-4h10l4 4h18a4 4 0 014 4v22a4 4 0 01-4 4H8a4 4 0 01-4-4z"/><path fill="#ffd45e" d="M4 20a3 3 0 013-3h34a3 3 0 013 3v18a4 4 0 01-4 4H8a4 4 0 01-4-4z"/>'),
pc:S('<rect x="5" y="7" width="38" height="26" rx="3" fill="#1b6fd8"/><rect x="8" y="10" width="32" height="20" rx="1.5" fill="#59b8ff"/><path d="M24 33v6M15 40h18" stroke="#9aa3ad" stroke-width="3.5" stroke-linecap="round"/>'),

  addEventListener("keydown",w._k);c.onclick=reset;draw()},
 onclose(w){clearInterval(w._t);removeEventListener("keydown",w._k)}},
weather:{icon:"weather",name:"Weather",w:480,h:380,store:1,desc:"Check the forecast (simulated).",body:()=>`<div class="pad"><h2>Weather</h2><div class="card">${wxHTML()}</div></div>`},
bin:{icon:"bin",name:"Recycle Bin",w:480,h:320,body:()=>`<div class="pad"><p class="sub">This folder is empty.</p></div>`}
};

/* windows */
const CTL={min:'<svg width="10" height="10"><path d="M0 5.5h10" stroke="currentColor"/></svg>',max:'<svg width="10" height="10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg>',x:'<svg width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg>'};
let z=10;
function launch(id,arg){const a=APPS[id];let w=$("#w-"+id);
 if(w&&arg){w.remove();w=null}
 if(w){w.classList.remove("hide");return front(w)}
 const n=$$(".win").length;w=document.createElement("div");w.className="win";w.id="w-"+id;
 w.style.cssText=`width:${Math.min(a.w,innerWidth-16)}px;height:${Math.min(a.h,innerHeight-64)}px;left:${Math.max(6,Math.min(110+n*30,innerWidth-a.w-6))}px;top:${30+n*30}px`;
 w.innerHTML=`<div class="tb">${ic(a.icon,16)}<span class="t">${a.name}</span><button data-a="min" aria-label="Minimize">${CTL.min}</button><button data-a="max" aria-label="Maximize">${CTL.max}</button><button data-a="x" class="x" aria-label="Close">${CTL.x}</button></div><div class="body">${a.body()}</div>`;
 $("#wins").appendChild(w);a.init&&a.init(w,arg);ensureTb(id).classList.add("on");
 w.onmousedown=()=>front(w);
 w.querySelector(".tb").onmousedown=e=>{if(e.target.closest("button")||w.classList.contains("max"))return;const dx=e.clientX-w.offsetLeft,dy=e.clientY-w.offsetTop;
  const mv=m=>{w.style.left=m.clientX-dx+"px";w.style.top=Math.max(0,Math.min(innerHeight-80,m.clientY-dy))+"px"},up=ev=>{removeEventListener("mousemove",mv);removeEventListener("mouseup",up);snap(w,ev)};addEventListener("mousemove",mv);addEventListener("mouseup",up)};
 w.querySelector(".tb").ondblclick=e=>{if(!e.target.closest("button"))w.classList.toggle("max")};
 w.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const t=b.dataset.a,k=$("#tb-"+id);
  if(t==="x"){a.onclose&&a.onclose(w);w.remove();if(k){k.classList.remove("on","act");k.classList.contains("tmp")&&k.remove()}}else if(t==="min"){w.classList.add("hide");k&&k.classList.remove("act")}else w.classList.toggle("max")});
 front(w)}
function front(w){w.style.zIndex=++z;$$("#tasks .tbn").forEach(b=>b.classList.remove("act"));const k=$("#tb-"+w.id.slice(2));k&&k.classList.add("act")}

/* build UI */
$("#blogo").innerHTML=I.win;$("#sb").innerHTML=ic("win",24);$("#lava").innerHTML=USER;$("#sava").innerHTML=USER;
$("#qsb").innerHTML=G.wifi+G.vol+G.bat;
const desk=[["bin","Recycle Bin"],["pc","This PC","explorer","This PC"],["folder","Projects","explorer","Projects"],["edge","Microsoft Edge","edge"],["store","Microsoft Store","store"],["term","Terminal","term"]];
desk.forEach(d=>$("#desk").insertAdjacentHTML("beforeend",`<div class="dic" tabindex="0" data-app="${d[2]||"bin"}" data-arg="${d[3]||""}">${ic(d[0],44)}${d[1]}</div>`));
const inst=(()=>{try{return JSON.parse(load("inst")||"[]")}catch(e){return[]}})();
function addApp(id){const a=APPS[id];if(a.pin&&!$("#tb-"+id))$("#tasks").insertAdjacentHTML("beforeend",`<button class="tbn" id="tb-${id}" data-app="${id}" title="${a.name}">${ic(a.icon,24)}</button>`);
 if(!$("#pins [data-app='"+id+"']"))$("#pins").insertAdjacentHTML("beforeend",`<div data-app="${id}" data-n="${a.name.toLowerCase()}">${ic(a.icon,30)}${a.name.replace("Microsoft ","")}</div>`);
 if(a.store&&!$("#desk [data-app='"+id+"']"))$("#desk").insertAdjacentHTML("beforeend",`<div class="dic" tabindex="0" data-app="${id}">${ic(a.icon,44)}${a.name}</div>`)}
Object.entries(APPS).forEach(([id,a])=>{if(a.pin||inst.includes(id))addApp(id)});
const doInstall=id=>{if(!inst.includes(id)){inst.push(id);save("inst",JSON.stringify(inst))}addApp(id)};
$("#allb").onclick=()=>{const v=$("#allv"),on=v.style.display==="none";$("#home").style.display=on?"none":"";v.style.display=on?"":"none";$("#allb").textContent=on?"‹ Back":"All apps ›";
 if(on)v.innerHTML=Object.entries(APPS).filter(([id,a])=>a.pin||inst.includes(id)||id==="bin").sort((x,y)=>x[1].name.localeCompare(y[1].name)).map(([id,a])=>`<div class="al" data-app="${id}">${ic(a.icon,24)}${a.name}</div>`).join("")};
[["Projects","doc"],["Notes.txt","note"],["Resume.docx","doc"],["Game ideas","folder"]].forEach(r=>$("#rec").insertAdjacentHTML("beforeend",`<div data-app="${r[1]==="note"?"notepad":"explorer"}" data-arg="${r[0]==="Projects"?"Projects":""}">${ic(r[1],26)}<span>${r[0]}<br><small>Recently opened</small></span></div>`));
const tgs=[["Wi-Fi",1],["Bluetooth",1],["Airplane mode",0],["Battery saver",0],["Dark mode",1,"dark"],["Night light",0]];
$("#tg").innerHTML=tgs.map((t,i)=>`<div class="${t[1]?"on":""}" data-i="${i}">${t[0]}</div>`).join("");
function tgSync(){const d=$("#tg [data-i='4']");d&&d.classList.toggle("on",!document.body.classList.contains("light"))}tgSync();
$$("#tg div").forEach(d=>d.onclick=()=>{if(d.dataset.i==="4")setMode(document.body.classList.contains("light")?"dark":"light");else d.classList.toggle("on")});
$("#br").oninput=e=>$("#dim").style.opacity=(100-e.target.value)/130;

/* flyouts */
const FL=["#start","#qs","#cal","#wg"];
function flyout(id){FL.forEach(f=>{if(f!==id)$(f).classList.remove("open")});$(id).classList.toggle("open");if(id==="#wg"&&$(id).classList.contains("open"))buildWg();$("#pmenu").classList.remove("open");$("#ctx").style.display="none";
 if(id==="#start"&&$(id).classList.contains("open")){$("#ssearch").value="";filt("");$("#home").style.display="";$("#allv").style.display="none";$("#allb").textContent="All apps ›";setTimeout(()=>$("#ssearch").focus(),30)}}
const filt=v=>$$("#pins div").forEach(d=>d.style.display=d.dataset.n.includes(v.toLowerCase())?"":"none");
$("#ssearch").oninput=e=>filt(e.target.value);
$("#sb").onclick=()=>flyout("#start");$("#sbox").onclick=()=>flyout("#start");$("#qsb").onclick=()=>flyout("#qs");$("#clk").onclick=()=>flyout("#cal");$("#wgb").onclick=()=>flyout("#wg");$("#tv").onclick=openTv;$("#tvw").onclick=()=>$("#tvw").classList.remove("open");
$("#ssearch").onkeydown=e=>{if(e.key!=="Enter")return;const v=e.target.value.trim(),m=$$("#pins div").find(d=>d.style.display!=="none");if(!v)return;FL.forEach(f=>$(f).classList.remove("open"));if(m&&m.dataset.n.includes(v.toLowerCase()))launch(m.dataset.app);else launch("edge",v)};
$("#pwr").onclick=e=>{e.stopPropagation();$("#pmenu").classList.toggle("open")};
$$("#pmenu div").forEach(d=>d.onclick=()=>{if(d.dataset.p==="restart")location.reload();else{$("#off").style.display="grid"}});
$("#off").onclick=()=>location.reload();

/* clicks */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-app]");
 if(t){const id=t.dataset.app,w=$("#w-"+id);
  if(t.classList.contains("dic"))return;
  if(t.closest("#tasks")&&w&&!w.classList.contains("hide")&&+w.style.zIndex===z){w.classList.add("hide");t.classList.remove("act")}else launch(id,t.dataset.arg||undefined);
  FL.forEach(f=>$(f).classList.remove("open"))}
 else if(!e.target.closest(".fly,#sb,#sbox,.tr")){FL.forEach(f=>$(f).classList.remove("open"))}
 $("#ctx").style.display="none"});
document.addEventListener("dblclick",e=>{const t=e.target.closest(".dic");t&&launch(t.dataset.app,t.dataset.arg||undefined)});
document.addEventListener("keydown",e=>{const t=e.target.closest&&e.target.closest(".dic");if(t&&e.key==="Enter")launch(t.dataset.app,t.dataset.arg||undefined)});
document.addEventListener("contextmenu",e=>{if(e.target.closest(".win,#bar,.fly"))return;e.preventDefault();const c=$("#ctx");
 c.innerHTML=`<div data-x="r">Refresh</div><hr><div data-x="p">Personalize</div><div data-x="d">Display settings</div><hr><div data-x="t">Open in Terminal</div>`;
 c.style.cssText=`display:block;left:${Math.min(e.clientX,innerWidth-240)}px;top:${Math.min(e.clientY,innerHeight-190)}px`;
 c.querySelectorAll("div").forEach(d=>d.onclick=()=>{const k=d.dataset.x;k==="r"?(document.body.style.opacity=.6,setTimeout(()=>document.body.style.opacity=1,120)):k==="t"?launch("term"):launch("settings",k==="p"?"Personalization":"System")})});

/* extras: taskbar buttons, snapping, widgets, task view */
function ensureTb(id){let b=$("#tb-"+id);if(!b){$("#tasks").insertAdjacentHTML("beforeend",`<button class="tbn tmp" id="tb-${id}" data-app="${id}" title="${APPS[id].name}">${ic(APPS[id].icon,24)}</button>`);b=$("#tb-"+id)}return b}
function snap(w,e){const o={top:"0",width:"50%",height:"calc(100% - 48px)"};if(e.clientY<4)w.classList.add("max");else if(e.clientX<4)Object.assign(w.style,o,{left:"0"});else if(e.clientX>innerWidth-4)Object.assign(w.style,o,{left:"50%"})}
G.tv='<svg viewBox="0 0 16 16"><rect x="1.5" y="3" width="9" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="5.5" y="6" width="9" height="7" rx="1.5" fill="var(--win)" stroke="currentColor" stroke-width="1.2"/></svg>';
$("#tv").innerHTML=G.tv;$("#ls").innerHTML=G.wifi+G.vol+G.bat;
$("#wgb").innerHTML=ic("weather",24)+'<span><div>24°C</div><div>Mostly sunny</div></span>';
const SUN='<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="9" fill="#ffb300"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2" stroke="#ffb300" stroke-width="3" stroke-linecap="round"/></svg>';
const CLD='<svg viewBox="0 0 48 48"><path d="M12 36a8 8 0 01-1-16 11 11 0 0121 3 7 7 0 01-1 13z" fill="#cfd9e6"/></svg>';
const wxHTML=()=>`<div class="wx">${ic("weather",56)}<div><div class="big">24°C</div><div>Mostly sunny</div></div></div><div class="fc">${[["Mon",SUN,"25°"],["Tue",CLD,"22°"],["Wed",SUN,"26°"],["Thu",CLD,"21°"],["Fri",SUN,"24°"]].map(f=>`<div>${f[0]}${f[1]}${f[2]}</div>`).join("")}</div><small>Simulated weather</small>`;
function buildWg(){const h=new Date().getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening";let td=[];try{td=JSON.parse(load("todo")||"[]")}catch(e){}
 $("#wg").innerHTML=`<h3>${g}, Priam</h3><div class="wgrid"><div class="wc w2">${wxHTML()}</div><div class="wc"><b>To Do</b><div id="tdl"></div><input id="tdin" placeholder="Add a task" autocomplete="off"></div><div class="wc"><b>Quick links</b><div style="margin-top:8px">${ME.links.map(l=>`<a class="todo" href="${l.u}" target="_blank" rel="noopener">↗ ${l.n}</a>`).join("")}</div></div><div class="wc w2"><b>Tips</b><p class="sub" style="margin-top:6px">Drag a window to the top edge to maximize it, or to the left or right edge to snap it. Right-click the desktop to personalize. Get more apps from the Microsoft Store.</p></div></div>`;
 const draw=()=>{$("#tdl").innerHTML=td.map((t,i)=>`<label class="todo ${t.d?"d":""}"><input type="checkbox" data-i="${i}" ${t.d?"checked":""}><span>${t.t.replace(/</g,"&lt;")}</span></label>`).join("")||`<small>Nothing to do. Nice!</small>`;
  $$("#tdl input").forEach(c=>c.onchange=()=>{td[c.dataset.i].d=c.checked;save("todo",JSON.stringify(td));draw()})};
 draw();$("#tdin").onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){td.push({t:e.target.value.trim(),d:0});save("todo",JSON.stringify(td));e.target.value="";draw()}}}
function openTv(){FL.forEach(f=>$(f).classList.remove("open"));const t=$("#tvw"),ws=$$(".win");if(t.classList.contains("open")){t.classList.remove("open");return}
 t.innerHTML=ws.length?ws.map(w=>{const id=w.id.slice(2);return `<div class="tvc" data-id="${id}">${ic(APPS[id].icon,48)}<span>${APPS[id].name}</span></div>`}).join(""):`<div style="color:#fff">No open windows</div>`;
 t.classList.add("open");t.querySelectorAll(".tvc").forEach(c=>c.onclick=e=>{e.stopPropagation();const w=$("#w-"+c.dataset.id);w.classList.remove("hide");front(w);t.classList.remove("open")})}

/* clock + calendar */
function tick(){const d=new Date();const tm=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
 $("#lt").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",hour12:false});$("#ld").textContent=d.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});
 $("#tt").textContent=tm;$("#td").textContent=d.toLocaleDateString()}
tick();setInterval(tick,1000);
(()=>{const d=new Date(),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 $("#cmo").textContent=d.toLocaleDateString([],{month:"long",year:"numeric"});
 let h=["Su","Mo","Tu","We","Th","Fr","Sa"].map(x=>`<b>${x}</b>`).join("")+"<span></span>".repeat(f);
 for(let i=1;i<=n;i++)h+=`<span class="${i===d.getDate()?"td":""}">${i}</span>`;$("#cg").innerHTML=h})();

/* boot → lock → login → desktop */
setTimeout(()=>$("#boot").classList.add("off"),2300);
const unlock=()=>{$("#lock").classList.add("up");setTimeout(()=>$("#pin").focus(),500)};
$("#lock").onclick=unlock;
addEventListener("keydown",()=>{if(!$("#lock").classList.contains("up")&&$("#boot").classList.contains("off"))unlock()});
const enter=()=>$("#login").classList.add("off");
$("#login .go").onclick=enter;$("#pin").onkeydown=e=>{if(e.key==="Enter")enter()};
</script>
